before_script:
  - make

.abstract_tests:
  image: $PHP_IMAGE:$PHP_VERSION
  script:
    - make test

test:8.5-lower:
  extends: .abstract_tests
  variables:
    PHP_VERSION: '8.5'
    DEPENDENCIES: lowest

test:8.5-upper:
  extends: .abstract_tests
  variables:
    PHP_VERSION: '8.5'
  script:
    - make test
    - make qa
